name: Publier le site AXEN sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les utilitaires d'export
        run: python -m pip install 'CairoSVG>=2.7,<3' 'tinycss2>=1.2,<2'
      - name: Vérifier le site
        run: python scripts/check_site.py
      - name: Préparer le site et générer les PNG
        run: python scripts/build_site.py
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
