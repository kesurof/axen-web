name: Publier le site AXEN sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les utilitaires d'export
        run: python -m pip install 'CairoSVG>=2.7,<3' 'tinycss2>=1.2,<2' 'Pillow>=10,<13'
      - name: Récupérer et optimiser les photos libres de réutilisation
        run: python scripts/fetch_photos.py
      - name: Versionner les photos en local
        shell: bash
        run: |
          git add assets/photos/*.webp
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets: vendor licensed copier photographs'
            git push origin HEAD:main
          else
            echo 'Photos already versioned.'
          fi
      - name: Vérifier le site
        run: python scripts/check_site.py
      - name: Préparer le site et générer les PNG
        run: python scripts/build_site.py
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
